# S3兼容层本地测试配置
# 无需修改任何配置，直接启动即可使用

# 服务端口
server:
  port: 9901

# S3兼容层配置
kitty:
  s3:
    enabled: true
    access-key: minioadmin
    secret-key: minioadmin
    signature-version: V4
    
    # 本地文件存储，默认使用系统临时目录
    storage:
      type: local
      local:
        base-path: ${java.io.tmpdir}/kitty-s3-test-data
    
    # 本地内存锁
    lock:
      type: local
    
    # 内存元数据存储
    metadata:
      type: local

# Spring配置
spring:
  application:
    name: kitty-s3-test
  main:
    banner-mode: off

# 日志配置
logging:
  level:
    root: INFO
    icu.jiapeng.kitty.plugin.s3: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"