<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>授权确认</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f8; }
    .box { max-width: 480px; margin: 48px auto; padding: 24px 28px; background: #fff; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    .muted { color: #666; font-size: .9rem; margin-bottom: 16px; }
    ul { margin: 12px 0; padding-left: 20px; }
    .actions { display: flex; gap: 12px; margin-top: 20px; }
    button { padding: 10px 18px; border-radius: 6px; border: none; cursor: pointer; font-size: 1rem; }
    .primary { background: #2563eb; color: #fff; }
    .ghost { background: #e5e7eb; color: #111; }
  </style>
</head>
<body>
<div id="app" class="box">
  <h1>应用请求授权</h1>
  <p class="muted">客户端 <strong>{{ clientId }}</strong> 请求以下权限：</p>
  <ul>
    <li v-for="s in scopes" :key="s">{{ s }}</li>
  </ul>
  <p v-if="!scopes.length" class="muted">（未指定 scope）</p>
  <form :action="formAction" method="post">
    <div class="actions">
      <button type="submit" name="action" value="approve" class="primary">同意</button>
      <button type="submit" name="action" value="deny" class="ghost">拒绝</button>
    </div>
  </form>
</div>
<script>
  const { createApp } = Vue;
  createApp({
    data() {
      return {
        clientId: "{{CLIENT_ID}}",
        scopes: {{SCOPES_JSON}}
      };
    },
    computed: {
      formAction() {
        const cp = "{{CONTEXT_PATH}}";
        return (cp || "") + "/oauth2/consent";
      }
    }
  }).mount("#app");
</script>
</body>
</html>
