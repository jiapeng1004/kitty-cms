schema: spec-driven

# 项目上下文（可选）
# 这会在AI创建工件时显示。
# 添加您的技术栈、约定、风格指南、领域知识等。
context: |
  技术栈：Java, Spring Boot, Spring WebFlux, R2DBC, MySQL, Vue.js
  项目使用中文作为主要开发语言
  所有文档和规范文件必须使用中文编写
  领域：内容管理系统(CMS)

# 每个工件的规则（可选）
# 为特定工件添加自定义规则。
rules:
  proposal:
    - 提案文档必须使用中文编写
    - 保持提案简洁明了，重点突出
  design:
    - 设计文档必须使用中文编写
    - 详细说明技术实现方案和决策理由
  specs:
    - 规范文件必须使用中文编写
    - 每个需求必须有至少一个场景
  tasks:
    - 任务列表必须使用中文编写
    - 将任务分解为最多2小时的工作量
