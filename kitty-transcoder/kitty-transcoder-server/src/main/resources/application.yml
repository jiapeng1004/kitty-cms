spring:
  application:
    name: kitty-transcoder
  data:
    redis:
      host: "127.0.0.1"
      port: 6379
      database: 0
      password: "123456"
  datasource:
    url: jdbc:h2:mem:transcode_db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 9703
  servlet:
    context-path: /${spring.application.name}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# 转码服务配置
transcoder:
  temp-dir: C:\\tmp\\transcode
  max-concurrent-tasks: 10
  task-timeout: 3600000
  ffmpeg-path: C:\\ffmpeg\\bin\\ffmpeg.exe
