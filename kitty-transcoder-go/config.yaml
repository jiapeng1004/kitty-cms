# kitty-transcoder-go 配置（GoFrame 经典嵌套，与 Java 版语义对齐）

server:
  address: ":9703"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"
  routeOverWrite: true

grpc:
  address: ":9803"

database:
  default:
    type: mysql
    link: "root:123456@tcp(127.0.0.1:3306)/kitty_transcoder?charset=utf8mb4&parseTime=True&loc=Local"
  # 开发可改用 sqlite，例如:
  # default:
  #   type: sqlite
  #   link: "file:transcoder.db"

redis:
  addr: "localhost:6379"
  password: "123456"   # 无密码留空
  db: 0          # 库索引，默认 0

auth:
  session:
    ttlSeconds: 86400   # 登录会话 TTL（秒）
  signature:
    timestampDriftSeconds: 300  # 签名时间戳允许漂移（秒）

transcoder:
  workDir: "${TEMP}/transcoder"
  tempDir: "${TEMP}/transcode"
  output:
    httpPrefix: ""
