syntax = "proto3";

package icu.jiapeng.kitty.permission.grpc;

option java_multiple_files = true;
option java_package = "icu.jiapeng.kitty.user.cfg.grpc";
option java_outer_classname = "KtConfigSvcSup";

service KtConfigSvc {
  rpc GetVal (GetValReq) returns (GetValResp) {
  }
}

// 获取配置值的请求
message GetValReq  {
  // 配置key
  string configKey = 1;
}

// 获取配置的结果
message GetValResp {
  // 配置值
  string configValue = 1;
}