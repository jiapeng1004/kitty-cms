syntax = "proto3";

package icu.jiapeng.kitty.permission.grpc;

option java_multiple_files = true;
option java_package = "icu.jiapeng.kitty.user.permission.grpc";
option java_outer_classname = "PermissionServiceSup";

service KtPermissionSvc {
  rpc GetPCodesByUserId (UserIdReq) returns (PermissionCodesResp) {
  }
}

// 用户id
message UserIdReq  {
  string userId = 1;
}

// 权限码集合
message PermissionCodesResp {
  // 是否合法token
  repeated string pCodes = 1;
}