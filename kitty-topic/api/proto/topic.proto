syntax = "proto3";

package icu.jiapeng.kitty.topic.grpc;

option go_package = "kitty-topic/internal/grpcpb";

option java_multiple_files = true;
option java_package = "icu.jiapeng.kitty.topic.grpc";
option java_outer_classname = "TopicServiceSup";

service TopicService {
  rpc CreateTopic (CreateTopicReq) returns (CreateTopicResp) {}
  rpc GetTopic (GetTopicReq) returns (TopicResp) {}
  rpc ListTopics (ListTopicsReq) returns (ListTopicsResp) {}
  rpc UpdateTopic (UpdateTopicReq) returns (UpdateTopicResp) {}
  rpc DeleteTopic (DeleteTopicReq) returns (DeleteTopicResp) {}

  rpc SubmitTopic (SubmitTopicReq) returns (OperationResp) {}
  rpc RejectTopic (RejectTopicReq) returns (OperationResp) {}
  rpc ApproveTopic (ApproveTopicReq) returns (OperationResp) {}
  rpc PublishTopic (PublishTopicReq) returns (OperationResp) {}
}

message CreateTopicReq {
  string title = 1;
  string source = 2;
  string content = 3;
  string tags = 4;
}

message CreateTopicResp {
  string id = 1;
}

message GetTopicReq {
  string id = 1;
}

message ListTopicsReq {
  int32 page = 1;
  int32 size = 2;
  string searchKey = 3;
  int32 status = 4;
}

message ListTopicsResp {
  repeated TopicResp topics = 1;
  int64 total = 2;
}

message UpdateTopicReq {
  string id = 1;
  string title = 2;
  string source = 3;
  string content = 4;
  string tags = 5;
}

message UpdateTopicResp {
  bool success = 1;
}

message DeleteTopicReq {
  string id = 1;
}

message DeleteTopicResp {
  bool success = 1;
}

message SubmitTopicReq { string id = 1; }
message RejectTopicReq { string id = 1; }
message ApproveTopicReq { string id = 1; }
message PublishTopicReq { string id = 1; }

message OperationResp {
  bool success = 1;
}

message TopicResp {
  string id = 1;
  string title = 2;
  string source = 3;
  string content = 4;
  string tags = 5;
  int32 status = 6;
  int64 publishedAt = 7;
  string createdBy = 8;
  string updatedBy = 9;
  int64 createdAt = 10;
  int64 updatedAt = 11;
}

