<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>应用授权</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
        }

        .consent-container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        .app-info {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .app-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #007bff, #0056b3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            font-weight: bold;
            margin-right: 20px;
        }

        .app-details {
            text-align: left;
        }

        .app-name {
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 5px 0;
            color: #333;
        }

        .app-description {
            color: #666;
            margin: 0;
        }

        .permission-section {
            margin: 25px 0;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #333;
        }

        .scopes-list {
            margin: 20px 0;
        }

        .scope-item {
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #e1e5eb;
            border-radius: 6px;
            display: flex;
            align-items: center;
            transition: all 0.2s ease;
        }

        .scope-item:hover {
            border-color: #007bff;
            box-shadow: 0 2px 5px rgba(0, 123, 255, 0.1);
        }

        .scope-checkbox {
            margin-right: 15px;
            transform: scale(1.3);
        }

        .scope-label {
            font-weight: 500;
            font-size: 16px;
            flex: 1;
        }

        .scope-description {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            gap: 15px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            flex: 1;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: #007bff;
            color: white;
        }

        .btn-primary:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: #fff;
            color: #6c757d;
            border: 1px solid #6c757d;
        }

        .btn-secondary:hover {
            background-color: #f8f9fa;
            transform: translateY(-2px);
        }

        .footer-note {
            text-align: center;
            margin-top: 25px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="consent-container">
    <div class="header">
        <h1>应用授权请求</h1>
        <p>请查看并确认以下权限请求</p>
    </div>

    <div class="app-info">
        <div class="app-icon" th:text="${#strings.substring(clientName, 0, 2)}"></div>
        <div class="app-details">
            <h2 class="app-name" th:text="${clientName}">应用名称</h2>
            <p class="app-description">请求访问您的账户信息</p>
        </div>
    </div>

    <div class="permission-section">
        <h3 class="section-title">请求的权限</h3>
        <p>应用 <strong th:text="${clientName ?: '未知应用'}">应用名称</strong> 希望获得以下权限：</p>

        <!--scope的key name的map-->
        <th:block>
            <div th:each="entry : ${scopeMap}">
                <!--权限列表-->
                <div class="scope-item">
                    <label>
                        <input type="checkbox"
                               name="scope"
                               th:value="${entry.key}"
                               th:checked="true"
                               class="scope-checkbox">
                    </label>
                    <div class="scope-details">
                        <div class="scope-description" th:text="${entry.value}"/>
                    </div>
                </div>
            </div>
        </th:block>

        <form method="post" action="/oauth2/authorize">
            <input type="hidden" name="client_id" th:value="${clientId}">
            <input type="hidden" name="state" th:value="${param.state}">

            <div class="scopes-list">
                <div class="scope-item" th:each="scope : ${scopes}">
                    <input type="checkbox"
                           name="scope"
                           th:value="${scope}"
                           th:checked="true"
                           class="scope-checkbox">
                    <div class="scope-details">
                        <div class="scope-label" th:text="${scope}">权限范围</div>
                        <div class="scope-description" th:switch="${scope}">
                            <span th:case="'read'">读取您的数据</span>
                            <span th:case="'write'">修改您的数据</span>
                            <span th:case="'profile'">访问您的个人资料</span>
                            <span th:case="'email'">访问您的邮箱地址</span>
                            <span th:case="*'">访问相关信息</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="buttons">
                <button type="submit"
                        name="user_oauth_approval"
                        value="false"
                        class="btn btn-secondary">
                    拒绝
                </button>
                <button type="submit"
                        name="user_oauth_approval"
                        value="true"
                        class="btn btn-primary">
                    同意授权
                </button>
            </div>
        </form>
    </div>

    <div class="footer-note">
        <p>授权后，您可以随时在账户设置中撤销此权限</p>
    </div>
</div>
</body>
</html>
