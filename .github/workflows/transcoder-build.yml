# 需在 Settings → Secrets → Actions 配置：
#   ALIYUN_ACR_PASSWORD: (ACR 访问凭证密码)
name: kitty-transcoder Build

env:
  MAVEN_CACHE_VERSION: v1

on:
  push:
    branches: [ main, develop ]
    tags: [ '*' ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    if: |
      (startsWith(github.ref, 'refs/tags/') && endsWith(github.ref_name, '_transcoder')) ||
      (!startsWith(github.ref, 'refs/tags/') && github.event.head_commit != null && (endsWith(github.event.head_commit.message, '_transcoder') || endsWith(github.event.head_commit.message, '_transcoder\n')))
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Cache Maven M2 (transcoder)
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-transcoder-${{ env.MAVEN_CACHE_VERSION }}-${{ runner.os }}
          restore-keys: |
            maven-transcoder-${{ env.MAVEN_CACHE_VERSION }}-

      - name: Build kitty-transcoder
        run: |
          chmod +x mvnw
          ./mvnw -B "-Djavacpp.platform=linux-x86_64" -pl kitty-server/kitty-transcoder-server -am -DskipTests clean package

      - name: Verify app.jar
        run: |
          test -f kitty-transcoder/kitty-transcoder-server/target/app.jar || (echo "app.jar not found" && exit 1)

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: kitty-transcoder/kitty-transcoder-server/target/app.jar

  build-frontend:
    runs-on: ubuntu-latest
    if: |
      (startsWith(github.ref, 'refs/tags/') && endsWith(github.ref_name, '_transcoder')) ||
      (!startsWith(github.ref, 'refs/tags/') && github.event.head_commit != null && (endsWith(github.event.head_commit.message, '_transcoder') || endsWith(github.event.head_commit.message, '_transcoder\n')))
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm (transcoder)
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            frontend/node_modules
            frontend/packages/transcoder/node_modules
          key: npm-transcoder-${{ runner.os }}-${{ hashFiles('frontend/packages/transcoder/package.json') }}
          restore-keys: |
            npm-transcoder-${{ runner.os }}-

      - name: Install and build frontend
        run: |
          cd frontend
          npm ci
          npm run build:transcoder

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/packages/transcoder/dist

  docker:
    runs-on: ubuntu-latest
    needs: [ build-backend, build-frontend ]
    if: |
      (startsWith(github.ref, 'refs/tags/') && endsWith(github.ref_name, '_transcoder')) ||
      (!startsWith(github.ref, 'refs/tags/') && github.event.head_commit != null && (endsWith(github.event.head_commit.message, '_transcoder') || endsWith(github.event.head_commit.message, '_transcoder\n')))
    steps:
      - uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: kitty-transcoder/kitty-transcoder-server/target

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/packages/transcoder/dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Alibaba ACR
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: aliyun7248933279
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Pull previous image (for cache)
        run: |
          docker pull registry.cn-hangzhou.aliyuncs.com/jp-java/kitty-transcoder:latest || true
        continue-on-error: true

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./kitty-server/kitty-transcoder-server/Dockerfile
          push: true
          tags: |
            registry.cn-hangzhou.aliyuncs.com/jp-java/kitty-transcoder:${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
            registry.cn-hangzhou.aliyuncs.com/jp-java/kitty-transcoder:latest
          cache-from: type=registry,ref=registry.cn-hangzhou.aliyuncs.com/jp-java/kitty-transcoder:latest
          cache-to: type=inline
