name: kitty-data-quarkus Build

on:
  push:
    branches: [ main, develop ]
    tags: [ '*' ]

jobs:
  native-build:
    runs-on: ubuntu-latest
    if: |
      (startsWith(github.ref, 'refs/tags/') && endsWith(github.ref_name, '_qk')) ||
      (!startsWith(github.ref, 'refs/tags/') && github.event.head_commit != null && (contains(github.event.head_commit.message, '_qk') || contains(github.event.head_commit.message, 'kitty-data-quarkus')))

    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25'
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          distribution: 'graalvm'

      # ==========================================
      # ✅ Maven 真正有效缓存（支持子目录）
      # ==========================================
      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('kitty-data-quarkus/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # ==========================================
      # ✅ UPX 百分百有效缓存（不从 apt 装）
      # ==========================================
      - name: Cache UPX
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/upx
          key: ${{ runner.os }}-upx-4.2.4

      - name: Install UPX
        run: |
          if [ ! -d upx ]; then
            wget -q https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-amd64_linux.tar.xz
            tar -xf upx-4.2.4-amd64_linux.tar.xz
            mv upx-4.2.4-amd64_linux upx
          fi
          echo "${{ github.workspace }}/upx" >> $GITHUB_PATH

      # ==========================================
      # 构建
      # ==========================================
      - name: Build native image
        run: |
          cd kitty-data-quarkus
          chmod +x mvnw
          ./mvnw -B clean package -Pnative -DskipTests

      # ==========================
      # ✅ ssh（阻塞）
      # ==========================
      #      - name: Debug CI - Connect via SSH
      #        uses: lhotari/action-upterm@v1


      - name: Compress
        run: |
          upx -1 kitty-data-quarkus/target/*-runner

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitty-data-quarkus-native
          path: kitty-data-quarkus/target/*-runner

  # ======================
  # Docker 部分不动
  # ======================
  docker:
    runs-on: ubuntu-latest
    needs: native-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kitty-data-quarkus-native
          path: kitty-data-quarkus/target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Alibaba ACR
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: aliyun7248933279
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./kitty-data-quarkus
          file: ./kitty-data-quarkus/src/main/docker/Dockerfile.native-alpine
          push: true
          tags: |
            registry.cn-hangzhou.aliyuncs.com/jp-java/kitty-data-quarkus:${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
            registry.cn-hangzhou.aliyuncs.com/jp-java/kitty-data-quarkus:latest