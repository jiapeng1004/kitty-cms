name: kitty-data-quarkus Build

on:
  push:
    branches: [ main, develop ]
    tags: [ '*' ]

jobs:

  native-build:
    runs-on: ubuntu-latest
    if: |
      (startsWith(github.ref, 'refs/tags/') && endsWith(github.ref_name, '_qk')) ||
      (!startsWith(github.ref, 'refs/tags/') && github.event.head_commit != null && (contains(github.event.head_commit.message, '_qk') || contains(github.event.head_commit.message, 'kitty-data-quarkus')))

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-kitty-data-qk-${{ runner.os }}-${{ hashFiles('kitty-data-quarkus/pom.xml') }}
          restore-keys: |
            maven-kitty-data-qk-${{ runner.os }}-

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25'          # 直接写主版本号
          java-version: '25'
          components: 'native-image'
          java-package: 'jdk'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          set-java-home: true
          distribution: 'graalvm'  # 必须加上，指定为 GraalVM 官方发行版

      - name: Build native image
        run: |
          cd kitty-data-quarkus
          chmod +x ./mvnw
          ./mvnw -B clean package -Pnative -DskipTests

      - name: Install UPX
        run: |
          sudo apt-get update
          sudo apt-get install -y upx

      - name: Compress native binary with UPX
        run: |
          upx -1 kitty-data-quarkus/target/kitty-data-quarkus-1.0-SNAPSHOT-native-image-source-jar/kitty-data-quarkus-1.0-SNAPSHOT-runner

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitty-data-quarkus-native
          path: kitty-data-quarkus/target/kitty-data-quarkus-1.0-SNAPSHOT-native-image-source-jar/kitty-data-quarkus-1.0-SNAPSHOT-runner

  docker:
    runs-on: ubuntu-latest
    needs: [ native-build ]
    if: |
      (startsWith(github.ref, 'refs/tags/') && endsWith(github.ref_name, '_qk')) ||
      (!startsWith(github.ref, 'refs/tags/') && github.event.head_commit != null && (contains(github.event.head_commit.message, '_qk') || contains(github.event.head_commit.message, 'kitty-data-quarkus')))

    steps:
      - uses: actions/checkout@v4

      - name: Download native artifact
        uses: actions/download-artifact@v4
        with:
          name: kitty-data-quarkus-native
          path: kitty-data-quarkus/target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Alibaba ACR
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: aliyun7248933279
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./kitty-data-quarkus
          file: ./kitty-data-quarkus/src/main/docker/Dockerfile.native-alpine
          push: true
          tags: |
            registry.cn-hangzhou.aliyuncs.com/jp-java/kitty-data-quarkus:${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
            registry.cn-hangzhou.aliyuncs.com/jp-java/kitty-data-quarkus:latest
