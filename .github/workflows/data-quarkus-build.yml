name: kitty-data-quarkus Build

on:
  push:
    branches: [ main, develop ]
    tags: [ '*' ]

jobs:
  native-build:
    runs-on: ubuntu-latest
    if: |
      (startsWith(github.ref, 'refs/tags/') && endsWith(github.ref_name, '_qk')) ||
      (!startsWith(github.ref, 'refs/tags/') && github.event.head_commit != null && (contains(github.event.head_commit.message, '_qk') || contains(github.event.head_commit.message, 'kitty-data-quarkus')))

    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25'
          java-version: '25'
          java-package: 'jdk'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          set-java-home: true
          cache: 'maven'
          distribution: 'graalvm'

      # ==========================
      # ✅ UPX 正确缓存（标准两步）
      # ==========================
      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-upx
          restore-keys: ${{ runner.os }}-apt-

      - name: Install UPX
        run: |
          sudo apt-get update
          sudo apt-get install -y upx

      # ==========================
      # ✅ 构建 Native
      # ==========================
      - name: Build native image
        run: |
          cd kitty-data-quarkus
          chmod +x ./mvnw
          ./mvnw -B clean package -Pnative -DskipTests

      # ==========================
      # ✅ ssh（阻塞）
      # ==========================
#      - name: Debug CI - Connect via SSH
#        uses: lhotari/action-upterm@v1

      # ==========================
      # ✅ 查看文件（不阻塞）
      # ==========================
      - name: List files
        run: ls -la kitty-data-quarkus/target/

      # ==========================
      # ✅ UPX 压缩（路径正确）
      # ==========================
      - name: Compress native binary
        run: |
          upx -1 kitty-data-quarkus/target/*-runner

      # ==========================
      # ✅ 上传（路径正确）
      # ==========================
      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitty-data-quarkus-native
          path: kitty-data-quarkus/target/*-runner

  docker:
    runs-on: ubuntu-latest
    needs: native-build
    if: |
      (startsWith(github.ref, 'refs/tags/') && endsWith(github.ref_name, '_qk')) ||
      (!startsWith(github.ref, 'refs/tags/') && github.event.head_commit != null && (contains(github.event.head_commit.message, '_qk') || contains(github.event.head_commit.message, 'kitty-data-quarkus')))

    steps:
      - uses: actions/checkout@v4

      - name: Download native artifact
        uses: actions/download-artifact@v4
        with:
          name: kitty-data-quarkus-native
          path: kitty-data-quarkus/target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Alibaba ACR
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: aliyun7248933279
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./kitty-data-quarkus
          file: ./kitty-data-quarkus/src/main/docker/Dockerfile.native-alpine
          push: true
          tags: |
            registry.cn-hangzhou.aliyuncs.com/jp-java/kitty-data-quarkus:${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
            registry.cn-hangzhou.aliyuncs.com/jp-java/kitty-data-quarkus:latest