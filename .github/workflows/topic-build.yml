name: kitty-topic Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Build kitty-topic
        working-directory: kitty-topic
        run: |
          go mod download
          go build -o /tmp/kitty-topic .

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and build topic frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build -w topic

      - name: Upload topic dist
        uses: actions/upload-artifact@v4
        with:
          name: topic-frontend-dist
          path: frontend/packages/topic/dist
