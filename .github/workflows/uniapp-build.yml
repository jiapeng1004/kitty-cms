# .github/workflows/uniapp-build.yml
name: UniApp Build and Deploy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-h5:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [16.x]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: frontend/packages/mobile/package-lock.json
    
    - name: Install dependencies
      run: |
        cd frontend/packages/mobile
        npm ci
    
    - name: Build H5
      run: |
        cd frontend/packages/mobile
        npm run build:h5
    
    - name: Upload H5 artifacts
      uses: actions/upload-artifact@v3
      with:
        name: h5-dist
        path: frontend/packages/mobile/dist/build/h5/
  
  build-android:
    runs-on: ubuntu-latest
    needs: build-h5
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16.x'
        cache: 'npm'
        cache-dependency-path: frontend/packages/mobile/package-lock.json
    
    - name: Install dependencies
      run: |
        cd frontend/packages/mobile
        npm ci
    
    - name: Build Android
      run: |
        cd frontend/packages/mobile
        npm run build:app-android
    
    - name: Upload Android artifacts
      uses: actions/upload-artifact@v3
      with:
        name: android-dist
        path: frontend/packages/mobile/dist/build/app-android/