syntax = "proto3";

package icu.jiapeng.kitty.user.grpc;

option java_multiple_files = true;
option java_package = "icu.jiapeng.kitty.user.auth.grpc";
option java_outer_classname = "AuthServiceSup";

option go_package = "kitty-topic/internal/grpcclient/authpb";

service AuthService {
  rpc TokenIntrospection (TokenIntrospectionReq) returns (TokenIntrospectionResp) {
  }
  rpc SaTokenDaoGet (SaTokenDaoGetReq) returns (SaTokenDaoGetResp) {
  }
  rpc SaTokenDaoTimeOut (SaTokenDaoTimeOutReq) returns (SaTokenDaoTimeOutResp) {
  }
}

message TokenIntrospectionReq  {
  string token = 1;
}

message TokenIntrospectionResp {
  bool valid = 1;
}

message SaTokenDaoGetReq {
  string key = 1;
}
message SaTokenDaoGetResp {
  string value = 1;
}

message SaTokenDaoTimeOutReq {
  string key = 1;
}
message SaTokenDaoTimeOutResp {
  int64 timeOut = 1;
}

