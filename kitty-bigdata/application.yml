logging:
  level: info
  # 留空则只打印到控制台；示例：logs/kitty-topic.log（父目录不存在会自动创建）
  file: ""
  # 配置了 file 时是否仍输出到控制台（默认 true）
  console: true

server:
  address: ":9704"
  swagger: true

grpc:
  address: ":9091"

database:
  dsn: "root:123456@tcp(localhost:3306)/kitty_topic?charset=utf8mb4&parseTime=True&loc=Local"

auth:
  kittyUserGrpcAddress: "kitty-user:9801"

topic:
  providers: { }

